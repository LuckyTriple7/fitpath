# Hält die gepinnten Versionen aktuell: Actions (Commit-SHA), Basisimage (Digest), Python-Pakete.
# Jede Woche höchstens ein PR je Bereich; die CI prüft Tests und pip-audit vor dem Mergen.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
